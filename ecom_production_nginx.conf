server {
    listen 80;
    server_name www.your-domain.com; # <--- CHANGE THIS to your actual domain

    client_max_body_size 50M;

    # Increase timeouts for large file uploads
    proxy_connect_timeout 300;
    proxy_send_timeout 300;
    proxy_read_timeout 300;
    send_timeout 300;

    # Frontend (Next.js)
    location / {
        proxy_pass http://127.0.0.1:3001; # <--- Matches FRONTEND_PORT (3001) in docker-compose
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API
    # Note: Ensure your Frontend API calls use /api/...
    location /api/ {
        proxy_pass http://127.0.0.1:8001; # <--- Matches BACKEND_PORT (8001) in docker-compose
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Handle large multipart/form-data uploads properly
        proxy_request_buffering off;
        proxy_buffering off;
    }

    # Backend Admin
    location /superuser/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static Files (Django)
    # These must be mapped from the Docker volume to the host path
    # e.g., in docker-compose.prod.yml, map volumes to ./data/staticfiles
    location /static/ {
        alias /var/www/ecom/staticfiles/; # <--- Make sure to map this path on Host
    }

    # Media Files (Django)
    location /media/ {
        alias /var/www/ecom/media/; # <--- Make sure to map this path on Host
    }
}
