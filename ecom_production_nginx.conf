server {
    listen 80;
    server_name www.your-domain.com; # <--- CHANGE THIS to your actual domain

    client_max_body_size 20M;

    # Frontend (Next.js)
    location / {
        proxy_pass http://127.0.0.1:3000; # <--- Matches FRONTEND_PORT in docker-compose
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API
    # Note: Ensure your Frontend API calls use /api/...
    location /api/ {
        proxy_pass http://127.0.0.1:8000; # <--- Matches BACKEND_PORT in docker-compose
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend Admin
    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static Files (Django)
    # These must be mapped from the Docker volume to the host path
    # e.g., in docker-compose.prod.yml, map volumes to ./data/staticfiles
    location /static/ {
        alias /var/www/ecom/staticfiles/; # <--- Make sure to map this path on Host
    }

    # Media Files (Django)
    location /media/ {
        alias /var/www/ecom/media/; # <--- Make sure to map this path on Host
    }
}
