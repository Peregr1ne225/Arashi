services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    env_file: .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      # Overrides or container-specific settings can stay here
      - SQL_HOST=db
      - SQL_PORT=5432
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    expose:
      - "8000"
    ports:
      # Map container 8000 to host BACKEND_PORT (default 8000)
      # 127.0.0.1 limits access to localhost (Nginx) only
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      - db
      - redis
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "nc -z localhost 8000 || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    env_file: .env
    environment:
      # API URLs
      - INTERNAL_API_URL=http://backend:8000/api/v1 # Server-side
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL} # Client-side (Public HTTPS domain)
    ports:
      # Map container 3000 to host FRONTEND_PORT (default 3000)
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: always

  db:
    image: postgres:15-alpine
    env_file: .env
    # environment: (No specific overrides needed if .env has POSTGRES_ vars)
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d app_db" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: always

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
